<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter arquivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main >
    <div id="drag-overlay">
        <span id="overlay-message">Solte o arquivo aqui</span>
    </div>
        <div id="message">Solte o arquivo aqui</div>

    <div id="file-card">

    <div id="div-loading">

</div>   
<ul id="format-list">
   
</ul>

</a>
