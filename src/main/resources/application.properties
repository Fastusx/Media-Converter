spring.application.name=MediaConverter

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# URL de conexão apontando para o localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/db_conversor
spring.datasource.username=arthur
spring.datasource.password=senhafodona
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update


# Mostra no console os comandos SQL que o Spring gerar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=${TOKEN_SECRET:chave_padrao_para_testes_locais}
app.ffmpeg.path=${FFMPEG_PATH:ffmpeg}
