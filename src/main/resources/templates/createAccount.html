<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
</head>
<body>
    <h1>Criar Conta</h1>
    <form id="account-create-form" method="POST">
        <label for="username">*Nome de Usuário:</label>
        <input type="text" id="username" name="username" required>
        <label id="username-error" class="error" style="display: none;"></label>
        
        <br><br>
        
        <label for="email">*Email:</label>
        <input type="email" id="email" name="email" required>
        <label id="email-error" class="error" style="display: none;"></label>
        
        <br><br>
        
        <label for="password">*Senha:</label>
        <input type="password" id="password" name="password" required>
        <label id="password-error" class="error" style="display: none;"></label>
        
        <br><br>
        
        <label for="confirmPassword">*Confirmar Senha:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <label id="confirmPassword-error" class="error" style="display: none;"></label>
        
        <br><br>
        
        <button type="submit">Criar Conta</button>
    </form>
<script src="formScript.js"></script>
</body>
</html>
