version: '3.8'

services:
  conversor-app:
    build: .
    container_name: conversor_api
    ports:
      - "8080:8080"
    volumes:
      - ./local-archives:/app/tmp/convertidos
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/db_conversor
      - SPRING_DATASOURCE_USERNAME=arthur
      - SPRING_DATASOURCE_PASSWORD=senhafodona
      - APP_FFMPEG_PATH=ffmpeg
      - APP_INPUT_PATH=/app/tmp/uploads
      - APP_OUTPUT_PATH=/app/tmp/convertidos
    depends_on:
      postgres-db:
        condition: service_healthy 

  postgres-db:
    image: postgres:15-alpine
    container_name: conversor_postgres
    restart: always
    environment:
      POSTGRES_USER: arthur
      POSTGRES_PASSWORD: senhafodona
      POSTGRES_DB: db_conversor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthur -d db_conversor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: