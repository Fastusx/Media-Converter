version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: conversor_postgres
    restart: always
    environment:
      POSTGRES_USER: arthur
      POSTGRES_PASSWORD: senhafodona
      POSTGRES_DB: db_conversor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   

volumes:
  postgres-data: